name: app-movil
on:
  push:
    paths: ['app-movil/**', '.github/workflows/app-movil.yml']
  pull_request:
    paths: ['app-movil/**', '.github/workflows/app-movil.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/verificar_cobertura.dart
      - name: Preparar Firebase Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo 'Falta el secret GOOGLE_SERVICES_JSON con el contenido del archivo Firebase Android.'
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Construir APK
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_MOVIL_CLIENT_ID: ${{ vars.KEYCLOAK_MOVIL_CLIENT_ID }}
        run: |
          flutter build apk --debug \
            --dart-define=GATEWAY_URL="${GATEWAY_URL:-http://localhost:8080}" \
            --dart-define=KEYCLOAK_URL="${KEYCLOAK_URL:-http://localhost:8180}" \
            --dart-define=KEYCLOAK_REALM="${KEYCLOAK_REALM:-agro}" \
            --dart-define=KEYCLOAK_CLIENT_ID="${KEYCLOAK_MOVIL_CLIENT_ID:-agro-movil}"
      - uses: actions/upload-artifact@v4
        with:
          name: agro-campo-apk
          path: app-movil/build/app/outputs/flutter-apk/app-debug.apk
