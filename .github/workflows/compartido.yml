name: compartido
on:
  push:
    paths: ["compartido/**",".github/workflows/compartido.yml"]
  pull_request:
    paths: ["compartido/**",".github/workflows/compartido.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compartido
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: compartido/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: compartido
          path: dist/compartido/
  desplegar:
    if: github.event_name == 'workflow_dispatch'
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compartido
          path: salida
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Publicar archivos
        env:
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: aws s3 sync salida/ "s3://$AWS_BUCKET/compartido/" --cache-control "no-cache"

